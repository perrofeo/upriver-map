# Despliegue del mapa de Upriver como sitio propio (mapa.therenderedchannel.com),
# embebido por iframe desde therenderedchannel.com.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Quién puede embeberlo. El sitio principal y sus previews de Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://therenderedchannel.com https://www.therenderedchannel.com https://*.netlify.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Bundles con hash: inmutables.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cesium/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Teselas: cambian cuando cambia el mapa; un día de caché.
[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
