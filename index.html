<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upriver · mapa del mundo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%231d3b2f'/%3E%3Cpath d='M2 9c3-3 5 3 8 0s3-1 4-2' stroke='%23bfe3d0' stroke-width='1.6' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="globo"></div>

  <header id="cabecera">
    <h1 data-i18n="titulo">Upriver</h1>
    <p class="sub" data-i18n="subtitulo">El mapa del mundo</p>
  </header>

  <button id="btn-panel" class="solo-movil" type="button" aria-controls="panel-lateral" aria-expanded="false" data-i18n="movil.panel">Capas y mirada</button>
  <aside id="panel-lateral">
    <button id="btn-cerrar-panel" class="solo-movil" type="button" aria-label="Cerrar" data-i18n-attr="aria-label:movil.cerrar">×</button>
    <section id="panel-vistas">
      <button id="btn-imperio" type="button" data-i18n="vista.imperio">El imperio</button>
      <button id="btn-mundo" type="button" data-i18n="vista.rio">El río</button>
    </section>
    <section id="panel-capas">
      <h2 data-i18n="panel.capas">Qué se ve</h2>
      <div id="capas-toggles"></div>
    </section>

    <section id="panel-estacion">
      <h2 data-i18n="panel.estacion">Estación</h2>
      <input type="range" id="estacion-slider" min="0" max="100" value="0" aria-label="Estación: vaciante a creciente" data-i18n-attr="aria-label:estacion.aria" />
      <div class="etiquetas"><span data-i18n="estacion.vaciante">Vaciante</span><span data-i18n="estacion.creciente">Creciente</span></div>
    </section>

    <section id="panel-estilos">
      <h2 data-i18n="panel.mirada">Mirada</h2>
      <div id="estilo-botones"></div>
      <label class="fila-control">
        <input type="checkbox" id="bloom-on" /><span data-i18n="mirada.brillo">Brillo</span>
        <input type="range" id="bloom-int" min="0" max="200" value="80" aria-label="Intensidad del brillo" data-i18n-attr="aria-label:mirada.brillo.aria" />
      </label>
      <label class="fila-control">
        <input type="checkbox" id="sharpen-on" /><span data-i18n="mirada.nitidez">Nitidez</span>
        <input type="range" id="sharpen-int" min="0" max="100" value="49" aria-label="Intensidad de la nitidez" data-i18n-attr="aria-label:mirada.nitidez.aria" />
      </label>
      <div id="estilo-params"></div>
      <button id="btn-compartir" type="button" data-i18n="enlace.copiar">Copiar enlace</button>
    </section>

    <nav id="idiomas" aria-label="Idioma"></nav>
  </aside>

  <div id="ficha" hidden></div>
  <div id="linea-tiempo" hidden></div>

  <!-- Modo autor: visible con ?autor -->
  <div id="panel-autor" hidden>
    <h2>Modo autor</h2>
    <p class="autor-linea">Puntero: <span id="autor-coord">—</span> <button id="autor-copiar-coord" class="autor-btn" type="button">Copiar</button></p>
    <p class="autor-ayuda">Arrastra un lugar para moverlo. Con el quipu en un momento, fija dónde empieza o termina su aparición.</p>
    <h3 id="autor-seleccionado">Ningún lugar seleccionado</h3>
    <div id="autor-apariciones"></div>
    <div class="autor-fila">
      <button id="autor-camara" class="autor-btn" type="button">Cámara aquí</button>
      <button id="autor-camara-quitar" class="autor-btn" type="button">Quitar cámara</button>
    </div>
    <div class="autor-fila">
      <button id="autor-exportar" class="autor-btn autor-btn-principal" type="button">Exportar datos</button>
      <button id="autor-descartar" class="autor-btn" type="button">Descartar cambios</button>
      <button id="autor-director" class="autor-btn" type="button">Director</button>
    </div>
    <p id="autor-estado" class="autor-estado"></p>
  </div>

  <!-- Director de escenas: herramienta de autoría, visible con ?autor -->
  <div id="scene-panel" hidden>
    <h2>Escenas <small>(autoría)</small></h2>
    <div class="scene-controls">
      <select id="scene-select" aria-label="Escena"></select>
      <button id="scene-new-btn" class="scene-btn" type="button">NUEVA</button>
      <button id="scene-delete-btn" class="scene-btn scene-btn-danger" type="button">BORRAR</button>
    </div>
    <div class="scene-controls">
      <button id="scene-capture-btn" class="scene-btn" type="button">CAPTURAR PLANO</button>
      <button id="scene-update-shot-btn" class="scene-btn" type="button">ACTUALIZAR PLANO</button>
    </div>
    <div id="scene-shot-list" class="scene-shot-list"></div>
    <div class="scene-controls">
      <button id="scene-start-btn" class="scene-btn" type="button">REPRODUCIR</button>
      <button id="scene-stop-btn" class="scene-btn scene-btn-danger" type="button">PARAR</button>
      <button id="scene-next-btn" class="scene-btn" type="button">SIGUIENTE</button>
    </div>
    <div class="scene-controls">
      <button id="scene-export-btn" class="scene-btn" type="button">EXPORTAR</button>
      <button id="scene-import-btn" class="scene-btn" type="button">IMPORTAR</button>
      <button id="scene-download-btn" class="scene-btn" type="button">REGISTRO</button>
      <input type="file" id="scene-import-file" accept="application/json,.json" hidden />
    </div>
    <div class="scene-progress"><div id="scene-progress-fill">0%</div></div>
    <div id="scene-status">Listo</div>
  </div>
  <div id="scene-runtime"></div>
  <div id="toast" hidden></div>

  <div id="carga">
    <div class="carga-tocapu" aria-hidden="true"></div>
    <div class="carga-titulo">Upriver</div>
    <div class="carga-estado" data-i18n="carga.globo">Preparando el globo…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
